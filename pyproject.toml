[project]
name = "rag-knowledgebase"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "alexisdjh", email = "1047585654@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.162.0",
    "openai>=3.42.1",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
rag-knowledgebase = "rag_knowledgebase:main"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
